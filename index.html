<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discount calculator</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; background: #eff4f2; color: #153b30; font: 17px/1.5 system-ui, sans-serif; }
    main { max-width: 520px; margin: auto; padding: 32px; background: white; border-radius: 20px; box-shadow: 0 12px 40px #153b3010; }
    h1 { font-size: 30px; margin: 0 0 8px; }
    p { color: #51655d; }
    label { display: block; margin-top: 20px; font-weight: 600; }
    input, button { width: 100%; padding: 12px; font: inherit; border-radius: 8px; }
    input { margin-top: 6px; border: 1px solid #a6bab1; }
    button { margin-top: 24px; background: #176849; color: white; border: none; cursor: pointer; }
    input:focus-visible, button:focus-visible { outline: 3px solid #dc9700; outline-offset: 3px; }
    output { display: block; margin-top: 24px; padding: 20px; background: #eaf5ee; border-radius: 8px; font-size: 25px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Discount calculator</h1>
    <p>Free delivery on every order. All amounts are in BDT.</p>
    <form id="calculator">
      <label for="subtotal">Items subtotal (BDT)</label>
      <input id="subtotal" type="number" min="0" max="1000000000" step="0.01" value="1000" required>
      <label for="discount">Discount (%)</label>
      <input id="discount" type="number" min="0" max="100" step="0.01" value="10" required>
      <label for="delivery">Delivery fee (BDT)</label>
      <input id="delivery" type="number" min="0" max="1000000000" step="0.01" value="100" required>
      <button type="submit">Calculate total</button>
    </form>
    <output id="total" for="subtotal discount delivery" aria-live="polite">Enter your order details.</output>
  </main>
  <script type="module" src="./web.js"></script>
</body>
</html>
