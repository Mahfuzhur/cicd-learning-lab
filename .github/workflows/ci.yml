name: Calculator CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the project code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Run calculator tests
        run: node --test

      - name: Package the website
        run: node build.js

      - name: Upload website artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Get the smoke test code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js for browser testing
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install browser test dependencies
        working-directory: smoke
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        working-directory: smoke
        run: npx playwright install --with-deps chromium

      - name: Check the live calculator
        working-directory: smoke
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test
